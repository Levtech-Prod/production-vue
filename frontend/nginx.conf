server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Matches the largest multer fileSize limit in the backend — firmware
    # uploads (FIRMWARE_MAX_UPLOAD_MB, default 100 MB). Documents are capped
    # lower, at 25 MB, by multer itself.
    client_max_body_size 100m;

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:4000/uploads/;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://backend:4000/health;
    }

    # Vue Router history mode: fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
